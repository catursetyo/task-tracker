<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker Kuliah v2 · REST API</title>
  <link rel="stylesheet" href="style.css">
  <script src="mock-api.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app">
    <h3>📋 Task Tracker Kuliah <small>v2 · REST API</small></h3>
    <form id="form" novalidate>
      <input name="judul" placeholder="Judul tugas (min. 3 karakter)">
      <div class="baris">
        <select name="matkul"></select>
        <input name="deadline" type="date">
        <button type="submit" id="simpan">Tambah</button>
      </div>
      <p id="err" class="err"></p>
    </form>
    <div class="filter" id="filter">
      <button data-f="semua" class="on">Semua</button>
      <button data-f="aktif">Aktif</button>
      <button data-f="selesai">Selesai</button>
      <span id="counter" class="counter"></span>
    </div>
    <p id="info" class="info"></p>
    <ul id="list"></ul>
  </div>
</body>
</html>
